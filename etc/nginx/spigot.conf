# Spigot reverse proxy.
#
# Installed by `make deploy/nginx` to /etc/nginx/sites-available/spigot.conf and
# symlinked into /etc/nginx/sites-enabled/. The @PLACEHOLDER@ tokens are
# substituted at install time from the Makefile's deployment variables.

upstream spigot {
    server @APP_HOST@:@APP_PORT@;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name @SERVER_NAME@;

    access_log /var/log/nginx/spigot.access.log;
    error_log /var/log/nginx/spigot.error.log;

    # `certbot --nginx` adds the TLS server block and the http -> https redirect
    # here once a real server_name and DNS record exist.

    location / {
        proxy_pass http://spigot;

        # Keepalive to the upstream requires HTTP/1.1 with no Connection header.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
