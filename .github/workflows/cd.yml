name: Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cd:
    runs-on: ubuntu-latest

    environment: 
      name: prod
      url: https://rss.poggers.lol

    env:
      SSH_USER: root
      SSH_HOST: rss.poggers.lol
      DEPLOY_DIR: /srv/spigot
      SERVER_NAME: rss.poggers.lol
      APP_PORT: 3000

    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the deploy host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          # The heredoc is unquoted so these variables expand here, on the
          # runner, and arrive as literals on the server.
          ssh "$SSH_USER@$SSH_HOST" bash -euo pipefail -s <<EOF
            # \`make deploy\` owns the deploy, including its own clone-or-pull.
            # This only covers the very first run, when there is no checkout to
            # run make from at all.
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Bootstrapping $DEPLOY_DIR from $REPO_URL"
              git clone --branch main "$REPO_URL" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            make deploy \
              DEPLOY_BRANCH=main \
              DEPLOY_DIR="$DEPLOY_DIR" \
              SERVER_NAME="$SERVER_NAME" \
              APP_PORT="$APP_PORT"
          EOF
