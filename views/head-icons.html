<!--
  The icon set, injected into each page rather than duplicated per template,
  for the same reason the stylesheet is.

  `/favicon.ico` is deliberately absent: a browser requests it from the root on
  its own, and the static mount answers it. Listing it here would add a tag that
  changes nothing.
-->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="manifest" href="/site.webmanifest" />
