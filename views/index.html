<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spigot</title>
    <script src="/vendor/htmx.min.js" defer></script>
    <style>
      :root {
        color-scheme: light dark;
        --border: color-mix(in srgb, currentColor 18%, transparent);
        --muted: color-mix(in srgb, currentColor 62%, transparent);
      }
      body {
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        max-width: 52rem;
        font:
          16px/1.55 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
      }
      .tagline {
        margin: 0 0 2rem;
        color: var(--muted);
      }
      h2 {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 2rem 0 0.75rem;
      }
      form {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
        align-items: end;
      }
      label {
        display: grid;
        gap: 0.3rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      input {
        font: inherit;
        padding: 0.5rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        min-width: 0;
      }
      button {
        font: inherit;
        padding: 0.55rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: color-mix(in srgb, currentColor 8%, transparent);
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        background: color-mix(in srgb, currentColor 14%, transparent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.6rem 0.5rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      td.count {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .description {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .empty td {
        color: var(--muted);
        padding: 1.5rem 0.5rem;
        text-align: center;
      }
      #errors:empty {
        display: none;
      }
      #errors {
        margin: 0.75rem 0 0;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--border);
        border-left: 3px solid currentColor;
        border-radius: 4px;
        font-size: 0.9rem;
      }
      #errors ul {
        margin: 0;
        padding-left: 1.1rem;
      }
      .htmx-request button {
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1>Spigot</h1>
    <p class="tagline">RSS feeds, assembled and served.</p>

    <h2>New feed</h2>
    <form
      hx-post="/feeds"
      hx-target="#feed-rows"
      hx-swap="innerHTML"
      hx-disabled-elt="find button"
      hx-on::after-request="if (event.detail.successful) this.reset()"
    >
      <label>
        Slug
        <input name="slug" placeholder="my-feed-name" required />
      </label>
      <label>
        Title
        <input name="title" placeholder="My Feed" required />
      </label>
      <label>
        Description
        <input name="description" placeholder="Optional" />
      </label>
      <button type="submit">Create feed</button>
    </form>
    <div id="errors" role="alert"></div>

    <script>
      // A rejected form is a 4xx, not a 200 carrying an apology. HTMX ignores
      // 4xx bodies by default, so opt back in for the statuses this app sends
      // deliberately; the server retargets them at #errors.
      document.body.addEventListener("htmx:beforeSwap", function (event) {
        const status = event.detail.xhr.status;
        if (status === 400 || status === 409) {
          event.detail.shouldSwap = true;
          event.detail.isError = false;
        }
      });
    </script>

    <h2>Feeds</h2>
    <table>
      <thead>
        <tr>
          <th scope="col">Feed</th>
          <th scope="col">Slug</th>
          <th scope="col">RSS</th>
          <th scope="col" class="count">Entries</th>
        </tr>
      </thead>
      <tbody id="feed-rows">
        {{rows}}
      </tbody>
    </table>
  </body>
</html>
