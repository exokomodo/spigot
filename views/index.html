<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spigot</title>
    <script src="/vendor/htmx.min.js" defer></script>
    {{styles}}
  </head>
  <body>
    <h1>Spigot</h1>
    <p class="tagline">RSS feeds, assembled and served.</p>

    <h2>New feed</h2>
    <form
      hx-post="/feeds"
      hx-target="#feed-rows"
      hx-swap="innerHTML"
      hx-disabled-elt="find button"
      hx-on::after-request="if (event.detail.successful) this.reset()"
    >
      <label>
        Slug
        <input name="slug" placeholder="my-feed-name" required />
      </label>
      <label>
        Title
        <input name="title" placeholder="My Feed" required />
      </label>
      <label>
        Description
        <input name="description" placeholder="Optional" />
      </label>
      <button type="submit">Create feed</button>
    </form>
    <div id="errors" role="alert"></div>

    <script>
      // A rejected form is a 4xx, not a 200 carrying an apology. HTMX ignores
      // 4xx bodies by default, so opt back in for the statuses this app sends
      // deliberately; the server retargets them at #errors.
      document.body.addEventListener("htmx:beforeSwap", function (event) {
        const status = event.detail.xhr.status;
        if (status === 400 || status === 404 || status === 409) {
          event.detail.shouldSwap = true;
          event.detail.isError = false;
        }
      });
    </script>

    <h2>Feeds</h2>
    <table>
      <thead>
        <tr>
          <th scope="col">Feed</th>
          <th scope="col">Slug</th>
          <th scope="col">RSS</th>
          <th scope="col" class="count">Entries</th>
        </tr>
      </thead>
      <tbody id="feed-rows">
        {{rows}}
      </tbody>
    </table>
  </body>
</html>
