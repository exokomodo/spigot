<button
  type="button"
  class="delete"
  aria-label="{{label}}"
  hx-delete="{{path}}"
  hx-target="{{target}}"
  hx-swap="innerHTML"
  hx-confirm="{{confirm}}"
  hx-disabled-elt="this"
>
  <!--
    Inline rather than an asset: there is no icon build step, and an inline icon
    inherits `currentColor` rather than needing a variant per state. `aria-hidden` because the button already has
    a name, so announcing the drawing too would say everything twice.
  -->
  <svg
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M4 7h16" />
    <path d="M10 4h4a1 1 0 0 1 1 1v2H9V5a1 1 0 0 1 1-1z" />
    <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" />
    <path d="M10 11v6" />
    <path d="M14 11v6" />
  </svg>
</button>
